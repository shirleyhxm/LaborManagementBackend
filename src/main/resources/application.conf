ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ org.labormanagement.ApplicationKt.module ]
    }
}

database {
    # PostgreSQL connection configuration
    # For AWS RDS, update these values with your RDS endpoint
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://localhost:5432/labormanagement"
    url = ${?DATABASE_URL}

    user = "shirleyhe"
    user = ${?DATABASE_USER}

    password = ""
    password = ${?DATABASE_PASSWORD}

    # HikariCP connection pool settings
    pool {
        maximumPoolSize = 10
        minimumIdle = 2
        connectionTimeout = 30000
        idleTimeout = 600000
        maxLifetime = 1800000
    }
}

# JWT configuration
jwt {
    secret = "your-secret-key-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "labor-management-system"
    audience = "labor-management-users"
    realm = "Labor Management"
    expirationMs = 3600000  # 1 hour
}
